trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  TF_ROOT: 'Monolithic_App_Deploy/environments/dev'
  terraformVersion: '1.9.8'
  azureServiceConnection: 'sc-azure-terraform'


# ============================================================
# STAGE 1 - SECURITY SCAN
# ============================================================

stages:

- stage: Scan

  displayName: 'Terraform Security Scan'

  jobs:

  - job: SecurityScan

    displayName: 'Terraform Security Checks'

    steps:

    - checkout: self


    # Install Terraform
    - task: TerraformInstaller@1

      displayName: 'Install Terraform'

      inputs:
        terraformVersion: $(terraformVersion)


    # Terraform Format
    - bash: |

        set -e

        cd "$(TF_ROOT)"

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'


    # Terraform Init
    - bash: |

        set -e

        cd "$(TF_ROOT)"

        terraform init -backend=false

      displayName: 'Terraform Init'


    # Terraform Validate
    - bash: |

        set -e

        cd "$(TF_ROOT)"

        terraform validate

      displayName: 'Terraform Validate'


    # TFLint
    - bash: |

        set -e

        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

        cd "$(TF_ROOT)"

        tflint --init

        tflint

      displayName: 'TFLint Scan'


    # Trivy
    - bash: |

        set -e

        sudo apt-get update

        sudo apt-get install -y wget gnupg

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update

        sudo apt-get install -y trivy

        trivy config "$(TF_ROOT)" \
          --severity HIGH,CRITICAL \
          --exit-code 1

      displayName: 'Trivy IaC Security Scan'


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan

  displayName: 'Terraform Plan'

  dependsOn: Scan

  condition: succeeded()

  jobs:

  - job: TerraformPlan

    displayName: 'Terraform Plan'

    steps:

    - checkout: self


    # Install Terraform
    - task: TerraformInstaller@1

      displayName: 'Install Terraform'

      inputs:
        terraformVersion: $(terraformVersion)


    # Terraform Init + Plan
    - task: AzureCLI@2

      displayName: 'Terraform Init and Plan'

      inputs:

        azureSubscription: $(azureServiceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          set -e

          cd "$(TF_ROOT)"

          echo "Terraform Version"

          terraform version

          echo "Terraform Init"

          terraform init

          echo "Terraform Plan"

          terraform plan \
            -input=false \
            -out="$(Build.ArtifactStagingDirectory)/tfplan"


    # Publish Plan
    - publish: $(Build.ArtifactStagingDirectory)/tfplan

      artifact: terraform-plan

      displayName: 'Publish Terraform Plan'


# ============================================================
# STAGE 3 - TERRAFORM APPLY
# ONLY MAIN BRANCH
# ============================================================

- stage: Apply

  displayName: 'Terraform Apply'

  dependsOn:
    - Scan
    - Plan

  condition: |

    and(
      succeeded(),
      eq(
        variables['Build.SourceBranch'],
        'refs/heads/main'
      )
    )

  jobs:

  - deployment: TerraformApply

    displayName: 'Terraform Apply'

    environment: Production

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self


          # Install Terraform
          - task: TerraformInstaller@1

            displayName: 'Install Terraform'

            inputs:
              terraformVersion: $(terraformVersion)


          # Download Plan
          - download: current

            artifact: terraform-plan

            displayName: 'Download Terraform Plan'


          # Terraform Apply
          - task: AzureCLI@2

            displayName: 'Terraform Apply'

            inputs:

              azureSubscription: $(azureServiceConnection)

              scriptType: bash

              scriptLocation: inlineScript

              inlineScript: |

                set -e

                cd "$(TF_ROOT)"

                echo "Terraform Init"

                terraform init

                echo "Terraform Apply"

                terraform apply \
                  -input=false \
                  "$(Pipeline.Workspace)/terraform-plan/tfplan"